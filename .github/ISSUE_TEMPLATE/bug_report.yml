name: Bug report / 问题反馈
description: Report a reproducible product or compatibility issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use English or Chinese. Do not include passwords, tokens, merchant secrets, database files, or private task content. Request a private channel for security vulnerabilities."
  - type: input
    id: version
    attributes:
      label: Codex Mobile version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Codex desktop version and Windows build
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Phone OS and browser version
      placeholder: iOS / Safari, Android / Chrome, or not applicable
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic task text and files where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal information, and private task content.
          required: true
